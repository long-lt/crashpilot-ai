[project]
name = "crashpilot-ai"
version = "0.1.0"
description = "Local-first Firebase Crashlytics monitoring agent"
requires-python = ">=3.12"
dependencies = [
  "playwright>=1.50",
  "google-auth[requests]>=2.40",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "sqlalchemy>=2.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["config*", "tests*"]
